; AAPI firmware for the Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; Run through uv so everyone uses the same PlatformIO:
;   uv run --group firmware pio run -d firmware -e gateway -t upload
;   uv run --group firmware pio test -d firmware -e native
; Versions are pinned so builds don't change under you; bump them on purpose.

[platformio]
default_envs = gateway
; Compiled objects are cached by content + flags: envs share them and they survive `-t clean`.
build_cache_dir = .pio/cache

[esp32]
platform = espressif32@7.1.3
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 460800
lib_deps = jgromes/RadioLib@7.8.1
; RADIOLIB_EXCLUDE_*: skip compiling radios/protocols we don't use (we only use the SX126x).
build_flags = -Wall
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_LORAWAN

[env:gateway]
; Base station: bridges USB serial <-> LoRa for the base Pi.
extends = esp32
build_src_filter = +<gateway/>

[env:rover]
; Rover: LoRa + safety watchdog + motors, servos, encoder, IMU.
extends = esp32
build_src_filter = +<rover/>

[env:blink]
extends = esp32
build_src_filter = +<blink/>

