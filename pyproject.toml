[project]
name = "aapi"
version = "0.1.0"
description = "Autonomous Agricultural Probing Interface"
readme = "README.md"
authors = [
    { name = "Paddy Yang" },
    { name = "Berry Xu" },
    { name = "Yunwen (Wendy) Zhu" },
    { name = "Kenneth Chan" },
]
# 3.11 = Raspberry Pi OS Bookworm, 3.13 = Trixie. The Pi use the system Python.
requires-python = ">=3.11"
dependencies = []  # protocol/ and core/ are standard-library only

[project.optional-dependencies]  # one extra per device role
rover = [
    "numpy>=2.4.6",
    "pyserial>=3.5",
]
base = [
    "fastapi>=0.162.0",
    "pyserial>=3.5",
    "uvicorn>=0.54.0",
]
sim = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[project.scripts]
aapi-rover = "aapi.apps.rover_main:main"
aapi-base = "aapi.apps.base_main:main"
aapi-sim = "aapi.sim.run:main"
aapi-chat = "aapi.apps.chat:main"

[dependency-groups]  # developer tools
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pyserial>=3.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-pyserial>=3.5.0.20261104",
]
firmware = [
    "platformio>=6.2.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"


[tool.mypy]
strict = true
files = ["src", "tools", "tests"]
mypy_path = "src"

[tool.importlinter]
root_package = "aapi"

[[tool.importlinter.contracts]]
name = "Lower layers never import higher ones (architecture.md §10)"
type = "layers"
# (name) = layer that doesn't exist yet; a | b = same level, must not import each other
layers = [
    "aapi.apps",
    "(aapi.web)",
    "(aapi.sim) | (aapi.drivers)",
    "(aapi.hal)",
    "(aapi.core)",
    "aapi.protocol",
]
